<!-- sign-in.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - ChristNow</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="images/logo-c.png" alt="ChristNow Logo" />
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="testimonials.html">Testimonials</a>
           <a href="sign-in.html" id="sign-in-link">Sign In</a>
    <a href="#" id="logout-link" style="display: none;">Sign Out</a>
    </nav>
  </header>
  <main class="form-container">
    <h1>Sign In to ChristNow</h1>
    <form id="signin-form" autocomplete="on">
      <input type="email" id="email" name="email" placeholder="Email" autocomplete="username email" required />
      <div class="password-field">
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
        <button type="button" class="password-toggle" data-password-toggle aria-controls="password" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <button type="submit">Sign In</button>
    </form>
    <p>Don't have an account? <a href="sign-up.html">Sign Up</a></p>
    <p id="login-message" class="response-message"></p>
  </main>
   <script src="nav-auth.js"></script>
  <script src="password-toggle.js"></script>
  <script src="sign-in.js"></script>
</body>
</html>
