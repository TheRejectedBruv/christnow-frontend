<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - ChristNow</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <img src="images/logo-c.png" alt="ChristNow Logo" />
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="testimonials.html">Testimonials</a>
           <a href="sign-in.html" id="sign-in-link">Sign In</a>
      <a href="#" id="logout-link" style="display: none;">Sign Out</a>
    </nav>
  </header>

  <main class="form-container">
    <h1>Create an Account</h1>
    <form id="signup-form" class="auth-form" autocomplete="off">
      <input type="text" id="signup-username" name="signup-username" placeholder="Username" autocomplete="off" autocapitalize="off" spellcheck="false" required />
      <input type="email" id="signup-email" name="signup-email" placeholder="Email" autocomplete="off" required />
      <div class="password-field">
        <input type="password" id="signup-password" name="signup-password" placeholder="Password" autocomplete="new-password" required />
        <button type="button" class="password-toggle" data-password-toggle aria-controls="signup-password" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <button type="submit">Sign Up</button>
    </form>
    <p id="signup-message" class="response-message"></p>
    <p>Already have an account? <a href="sign-in.html">Sign In</a></p>
  </main>

  <!-- ✅ Make sure this is at the BOTTOM of the body -->
   <script src="nav-auth.js"></script>
  <script src="password-toggle.js"></script>
  <script src="signup.js"></script>
</body>
</html>
