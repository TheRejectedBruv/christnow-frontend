<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - ChristNow</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Profile-only layout — does not change global styles.css */
    .profile-page {
      max-width: 640px;
      margin: 48px auto 64px;
      padding: 0 20px;
    }

    .profile-page h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: #2c164e;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    .profile-page h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #543386;
      text-align: center;
      margin: 36px 0 18px;
    }

    .profile-account-card {
      background: #fff;
      border-radius: 13px;
      box-shadow: 0 2px 18px rgba(123, 31, 162, 0.09);
      padding: 28px 32px;
      border: 1px solid #f0e8f8;
    }

    .profile-account-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid #f3f0f8;
      font-size: 1rem;
    }

    .profile-account-row:last-child {
      border-bottom: none;
    }

    .profile-account-label {
      font-weight: 600;
      color: #543386;
    }

    .profile-account-value {
      color: #444;
      text-align: right;
      word-break: break-word;
    }

    .profile-course-list {
      background: #fff;
      border-radius: 13px;
      box-shadow: 0 2px 18px rgba(123, 31, 162, 0.09);
      border: 1px solid #f0e8f8;
      overflow: hidden;
    }

    .profile-course-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid #f0e8f8;
    }

    .profile-course-row:last-child {
      border-bottom: none;
    }

    .profile-course-name {
      font-weight: 600;
      color: #2c164e;
      font-size: 1rem;
    }

    .profile-course-row .start-course-btn {
      flex-shrink: 0;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      padding: 10px 18px;
      font-size: 0.95rem;
    }

    .profile-empty {
      text-align: center;
      color: #666;
      font-size: 1rem;
      line-height: 1.6;
      padding: 24px 12px;
    }

    .profile-empty a {
      color: #7B1FA2;
      font-weight: 600;
      text-decoration: none;
    }

    .profile-empty a:hover {
      text-decoration: underline;
    }

    .profile-error {
      text-align: center;
      color: #B71C1C;
      margin-top: 16px;
      font-size: 0.95rem;
    }

    @media (max-width: 520px) {
      .profile-course-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .profile-course-row .start-course-btn {
        width: 100%;
      }

      .profile-account-row {
        flex-direction: column;
        gap: 4px;
      }

      .profile-account-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="images/logo-c.png" alt="ChristNow Logo" />
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="testimonials.html">Testimonials</a>
      <a href="sign-in.html" id="sign-in-link">Sign In</a>
      <a href="#" id="logout-link" style="display: none;">Sign Out</a>
    </nav>
  </header>

  <main class="profile-page">
    <h1>My Profile</h1>

    <div class="profile-account-card">
      <div class="profile-account-row">
        <span class="profile-account-label">Email</span>
        <span class="profile-account-value" id="profile-email">Loading...</span>
      </div>
      <div class="profile-account-row">
        <span class="profile-account-label">Username</span>
        <span class="profile-account-value" id="profile-username">Loading...</span>
      </div>
    </div>

    <h2>My Courses</h2>

    <div id="profile-course-list" class="profile-course-list"></div>

    <p id="profile-empty" class="profile-empty" style="display: none;">
      You don't have any courses yet.
      <a href="courses.html">Browse courses</a> to get started.
    </p>

    <p id="profile-error" class="profile-error"></p>
  </main>

  <script src="nav-auth.js"></script>
  <script src="profile.js"></script>
</body>
</html>
